apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    namespace 'lrp.aibum'

    defaultConfig {
        applicationId "lrp.aibum"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 200
        versionName "1.0.0"
        multiDexEnabled true
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }

    signingConfigs {
        config {
            keyAlias 'android'
            keyPassword '123456'
            storeFile file('C:/Users/lrp/Downloads/HBuilderX/plugins/app-safe-pack/Test.keystore')
            storePassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }

    packagingOptions {
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/LICENSE'
        doNotStrip '*/armeabi-v7a/*.so'
        doNotStrip '*/arm64-v8a/*.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.1.0'
    implementation "androidx.fragment:fragment:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:2.5.0'
    implementation "com.facebook.fresco:animated-gif:2.5.0"
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
    // 热更新必需：wgt 就是 zip，plus.runtime.install 解压时用 zip4j。
    // 缺这个库 基座会在 install 时 FATAL：
    //   Unresolved exception class when finding catch block:
    //     net.lingala.zip4j.exception.ZipException
    //   java.lang.NullPointerException: Attempt to read from null array
    //     at io.dcloud.feature.pdr.RuntimeFeatureImpl$a.run
    // 表现为「推送了 wgt，App 点立即更新就闪退，永远装不上新版」。
    // 这是 DCloud 离线打包的已知要求，必须手动加。
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
