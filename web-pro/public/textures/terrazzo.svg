    <circle cx="50" cy="120" r="2" fill="#444" />
    <circle cx="160" cy="80" r="1.5" fill="#A8624E" />
    <circle cx="210" cy="160" r="2.5" fill="#222" />
    <circle cx="130" cy="150" r="2" fill="#C5A069" />
    <circle cx="280" cy="230" r="2" fill="#9C5642" />
    <circle cx="95" cy="275" r="2.5" fill="#333" />
