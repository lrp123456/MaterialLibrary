<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#DFD9D1" />
  <!-- 水磨石骨料碎石 -->
  <g>
    <!-- 黑色系碎石 -->
    <polygon points="35,25 45,35 30,42" fill="#2B2A29" />
    <polygon points="120,60 135,55 125,75" fill="#3D3C3A" />
    <polygon points="220,40 238,48 228,62 215,50" fill="#1C1B1A" />
    <polygon points="80,180 95,170 100,190 78,195" fill="#2E2D2C" />
    <polygon points="260,190 275,185 270,205" fill="#333230" />
    <polygon points="170,250 185,240 190,265 165,270" fill="#252423" />
    <!-- 暖红/陶土碎石 -->
    <polygon points="75,80 90,75 85,95" fill="#A8624E" />
    <polygon points="180,110 195,120 175,130" fill="#BA6F5B" />
    <polygon points="40,240 55,230 60,250 35,255" fill="#9C5642" />
    <polygon points="240,260 255,250 250,270" fill="#B36551" />
